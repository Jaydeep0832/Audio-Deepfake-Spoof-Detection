version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio_deepfake_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: audio_deepfake_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
